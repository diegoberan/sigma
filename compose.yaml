services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigma
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: sigma
    volumes:
      - sigma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma -d sigma"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "uv run python manage.py migrate && uv run gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: django-insecure-local-sigma
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://sigma:sigma@db:5432/sigma
      MQTT_HOST: test.mosquitto.org
      MQTT_PORT: "1883"
      MQTT_TOPIC: esp32-grupo22/dados
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  mqtt-worker:
    build: .
    command: uv run python manage.py mqtt_worker
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: django-insecure-local-sigma
      DATABASE_URL: postgresql://sigma:sigma@db:5432/sigma
      MQTT_HOST: test.mosquitto.org
      MQTT_PORT: "1883"
      MQTT_TOPIC: esp32-grupo22/dados
    depends_on:
      db:
        condition: service_healthy

volumes:
  sigma_postgres_data:
