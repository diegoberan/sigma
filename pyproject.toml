[project]
name = "sigma"
version = "0.1.0"
description = "SIGMA - Sistema Integrado Georreferenciado de Monitoramento de Anemômetros"
authors = [
    { name = "Diego Beran", email = "diegoberan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.17",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

